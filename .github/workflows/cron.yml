name: Scheduled jobs

# node-cron não funciona de forma confiável em funções serverless (Vercel Hobby
# não tem Cron Jobs frequentes). Esse workflow assume esse papel, batendo em
# /api/cron/[job] nos mesmos horários que antes rodavam via node-cron.
# Horários em UTC (Brasil = UTC-3, sem horário de verão).

on:
  schedule:
    - cron: "*/5 * * * *"  # gmail-sync + task-reminders — a cada 5 min
    - cron: "*/30 * * * *" # calendar-sync — a cada 30 min
    - cron: "0 11 * * *"   # deadlines — 8h BRT
    - cron: "0 20 * * *"   # deadlines — 17h BRT
    - cron: "0 21 * * *"   # briefing — 18h BRT
    - cron: "0 11 * * 1"   # digest — segunda 8h BRT
  workflow_dispatch:
    inputs:
      job:
        description: "Job pra rodar manualmente"
        required: true
        type: choice
        options: [gmail-sync, calendar-sync, task-reminders, deadlines, briefing, digest]

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Determina qual(is) job(s) rodar
        id: pick
        run: |
          if [ -n "${{ github.event.inputs.job }}" ]; then
            echo "jobs=${{ github.event.inputs.job }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              # dois jobs no mesmo slot: duas entradas de cron idênticas não dariam pra
              # distinguir aqui (github.event.schedule seria a mesma string), e uma
              # segunda entrada */5 dobraria o consumo de minutos do Actions
              "*/5 * * * *")  echo "jobs=gmail-sync task-reminders" >> "$GITHUB_OUTPUT" ;;
              "*/30 * * * *") echo "jobs=calendar-sync" >> "$GITHUB_OUTPUT" ;;
              "0 11 * * *")   echo "jobs=deadlines" >> "$GITHUB_OUTPUT" ;;
              "0 20 * * *")   echo "jobs=deadlines" >> "$GITHUB_OUTPUT" ;;
              "0 21 * * *")   echo "jobs=briefing" >> "$GITHUB_OUTPUT" ;;
              "0 11 * * 1")   echo "jobs=digest" >> "$GITHUB_OUTPUT" ;;
              *) echo "jobs=gmail-sync" >> "$GITHUB_OUTPUT" ;;
            esac
          fi

      - name: Chama /api/cron (${{ steps.pick.outputs.jobs }})
        env:
          APP_URL: https://tarefasgestao-zeta.vercel.app
        run: |
          failed=0
          for job in ${{ steps.pick.outputs.jobs }}; do
            http_code=$(curl -s --max-time 60 -o response.json -w "%{http_code}" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              "$APP_URL/api/cron/$job")
            echo "[$job] HTTP status: $http_code"
            echo "[$job] Resposta:"
            cat response.json
            echo
            if [ "$http_code" -ge 400 ]; then
              echo "::error::Job $job falhou com HTTP $http_code"
              failed=1
            fi
          done
          exit $failed
